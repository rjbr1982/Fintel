name: fintel
description: Financial Intelligence Application based on Dohaham method.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # Utilities
  intl: ^0.20.0 
  
  # Notifications & Time
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2          # 🔒 ADDED: Timezone support for notifications
  flutter_timezone: ^1.0.8   # 🔒 ADDED: Fetch local device timezone
  
  # System
  path_provider: ^2.1.5
  local_auth: ^2.2.0
  package_info_plus: ^8.0.0 # 🔒 ADDED: Automatic Version Tracking
  
  # SaaS & Firebase Cloud (Constitution 5.10 & 5.17)
  firebase_core: ^4.4.0 
  cloud_firestore: ^6.1.2 
  firebase_auth: ^6.1.4 
  google_sign_in: ^6.3.0 
  firebase_ui_auth: ^3.0.1 
  firebase_ui_oauth_google: ^2.0.1 
  firebase_messaging: ^16.1.2 # 🔒 EDITED: Upgraded version to resolve interface conflict
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # מחולל אייקונים אוטומטי לכל הפלטפורמות
  flutter_launcher_icons: ^0.13.1

# הגדרות מחולל האייקונים (Web + Mobile)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/fintel_icon.png"
  web:
    generate: true
    image_path: "assets/icon/fintel_icon.png"
    background_color: "#121212"
    theme_color: "#121212"

flutter:
  uses-material-design: true
  assets:
    # ציון התיקייה כולה מאפשר לפלאטר לטעון את כל התמונות שבתוכה (fintel_icon, premium_icon, crown_icon, splash)
    - assets/icon/
    - assets/fintel_brain_capsule.txt